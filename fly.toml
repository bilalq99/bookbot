# Fly.io config for the Chalk API. First deploy:
#   fly launch --copy-config --no-deploy   (pick an app name + region)
#   fly volumes create chalk_data --size 1
#   fly deploy
#   fly scale count 1   # SQLite on a volume → exactly one machine
# The app then serves https://<app>.fly.dev — use that as VITE_API_BASE.
app = "chalk-api"
primary_region = "iad"

[env]
  PORT = "3000"
  DB_PATH = "/data/chalk.db"
  UPLOADS_DIR = "/data/uploads"
  TRUST_PROXY = "1"
  COOKIE_SECURE = "1"

[[mounts]]
  source = "chalk_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # SQLite lives on the volume of a single machine — never autostop/scale out.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
